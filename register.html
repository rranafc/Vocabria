<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up – Vocabria</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="images/favicon.png">

    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 5% 60px;
            background: linear-gradient(135deg, #f5f0ff, #eef6ff);
        }

        .auth-card {
            background: white;
            border-radius: 32px;
            padding: 50px 44px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 24px 60px rgba(124, 58, 237, 0.12);
            text-align: center;
        }

        .auth-card .emoji  { font-size: 52px; margin-bottom: 12px; }
        .auth-card h1      { font-size: 36px; color: #13265c; margin-bottom: 8px; }
        .auth-card .sub    { font-size: 17px; color: #64748b; margin-bottom: 32px; }

        .auth-field {
            text-align: left;
            margin-bottom: 18px;
        }

        .auth-field label {
            display: block;
            font-size: 15px;
            font-weight: 600;
            color: #13265c;
            margin-bottom: 7px;
        }

        .auth-field input {
            width: 100%;
            padding: 13px 18px;
            border: 2.5px solid rgba(124, 58, 237, 0.2);
            border-radius: 14px;
            font-family: 'Fredoka', sans-serif;
            font-size: 17px;
            color: #13265c;
            outline: none;
            transition: border-color 0.2s;
            background: #faf8ff;
        }

        .auth-field input:focus {
            border-color: #7c3aed;
            background: white;
        }

        .auth-submit {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, #7c3aed, #9333ea);
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-size: 19px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(124, 58, 237, 0.28);
            transition: transform 0.2s, opacity 0.2s;
            margin-top: 8px;
        }

        .auth-submit:hover    { transform: translateY(-3px); }
        .auth-submit:disabled { opacity: 0.6; cursor: default; transform: none; }

        .auth-msg {
            margin-top: 16px;
            font-size: 16px;
            font-weight: 600;
            min-height: 24px;
        }

        .auth-msg.error   { color: #dc2626; }
        .auth-msg.success { color: #16a34a; }

        .auth-switch {
            margin-top: 24px;
            font-size: 16px;
            color: #64748b;
        }

        .auth-switch a {
            color: #7c3aed;
            font-weight: 700;
            text-decoration: none;
        }

        .auth-switch a:hover { text-decoration: underline; }

        .password-rules {
            font-size: 13px;
            color: #94a3b8;
            text-align: left;
            margin-top: -10px;
            margin-bottom: 18px;
        }
    </style>
</head>

<body>

    <div class="auth-page">
        <div class="auth-card">

            <div class="emoji">🌟</div>
            <h1>Join Vocabria!</h1>
            <p class="sub">Create an account and start learning</p>

            <div class="auth-field">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="e.g. WordWizard42" autocomplete="username">
            </div>

            <div class="auth-field">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@email.com" autocomplete="email">
            </div>

            <div class="auth-field">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="new-password">
            </div>
            <p class="password-rules">At least 6 characters</p>

            <button class="auth-submit" id="register-btn" onclick="handleRegister()">
                Create Account
            </button>

            <div class="auth-msg" id="auth-msg"></div>

            <div class="auth-switch">
                Already have an account?
                <a href="login.html">Log In</a>
            </div>

        </div>
    </div>

    <script type="module">
        import { signUp } from './js/auth.js'

        window.handleRegister = async function () {
            const username = document.getElementById('username').value.trim()
            const email    = document.getElementById('email').value.trim()
            const password = document.getElementById('password').value
            const btn      = document.getElementById('register-btn')
            const msg      = document.getElementById('auth-msg')

            /* Basic validation */
            if (!username || !email || !password) {
                msg.textContent = 'Please fill in all fields.'
                msg.className   = 'auth-msg error'
                return
            }

            if (username.length < 3) {
                msg.textContent = 'Username must be at least 3 characters.'
                msg.className   = 'auth-msg error'
                return
            }

            if (password.length < 6) {
                msg.textContent = 'Password must be at least 6 characters.'
                msg.className   = 'auth-msg error'
                return
            }

            btn.disabled    = true
            btn.textContent = 'Creating account…'
            msg.textContent = ''

            const result = await signUp(username, email, password)

            if (result.success) {
                msg.textContent = '✓ ' + result.message
                msg.className   = 'auth-msg success'
                setTimeout(() => window.location.href = 'login.html', 2500)
            } else {
                msg.textContent = result.message
                msg.className   = 'auth-msg error'
                btn.disabled    = false
                btn.textContent = 'Create Account'
            }
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') handleRegister()
        })
    </script>

</body>
</html>
